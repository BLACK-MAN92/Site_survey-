openapi: 3.1.0
info:
  title: Site Survey API
  version: 1.0.0
  description: The backend API for the site survey field app.

servers:
  - url: /api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            requestId:
              type: string

    Site:
      type: object
      required: [id, name, cycleState]
      properties:
        id:
          type: string
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        cycleState:
          type: string
          enum: [pre_due, post_due, in_review, ready_for_ihs, at_ihs, closed, rework]
        rejectionReason:
          type: string
        rejectionComment:
          type: string

    SiteListResponse:
      type: object
      required: [sites]
      properties:
        sites:
          type: array
          items:
            $ref: '#/components/schemas/Site'

    SurveyCreateRequest:
      type: object
      required: [siteId, clientUuid, type, plannedDate, workItems]
      properties:
        siteId:
          type: string
        clientUuid:
          type: string
        type:
          type: string
          enum: [pre, post]
        plannedDate:
          type: string
          format: date-time
        actualDate:
          type: string
          format: date-time
        gpsLat:
          type: number
        gpsLng:
          type: number
        gpsAccuracy:
          type: number
        outOfFenceReason:
          type: string
        comment:
          type: string
        workItems:
          type: array
          items:
            type: object
            properties:
              itemType:
                type: string
              required:
                type: boolean
              progress:
                type: string
              qtyReplaced:
                type: integer

paths:
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Token Reuse Detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sites/assigned:
    get:
      summary: Get assigned sites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteListResponse'

  /surveys:
    post:
      summary: Create survey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveyCreateRequest'
      responses:
        '200':
          description: Success
          headers:
            Idempotent-Replay:
              schema:
                type: boolean
        '409':
          description: Duplicate Survey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
